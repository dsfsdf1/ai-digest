name: Daily Digest

on:
  schedule:
    # Runs every hour — the endpoint itself checks if it's the right time per user's timezone
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily digest
        run: |
          curl -s -f \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily"
